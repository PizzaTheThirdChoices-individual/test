<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SONG | PIZZA</title><link rel="stylesheet" href="style.css"></head><body><div class="site-shell"><nav class="top-nav"><a class="wordmark" href="index.html">Pizza The Third Choices</a><div class="nav-links"><a href="index.html">HOME</a><a href="music.html">MUSIC</a><a href="live.html">LIVE / ARCHIVE</a><a href="merch.html">MERCH</a></div><div class="social-links header-social" data-social-links aria-label="公式SNS・配信ストア"></div></nav><main><p><a href="music.html" style="color:#ddd">← 楽曲表に戻る</a></p><p class="eyebrow">PIZZA THE THIRD CHOICES / SONG DETAIL</p><section id="song-page" class="detail"></section><p class="intro">楽曲の解説・制作背景・音源リンクなどを今後追加できます。</p><section class="social-section"><h2>FOLLOW US</h2><div class="social-links" data-social-links></div></section></main></div><script src="data/albums.js"></script><script src="data/songs.js"></script><script src="data/descriptions.js"></script><script src="data/videos.js"></script><script src="script.js"></script><script>const id=Number(new URLSearchParams(location.search).get('id'));const s=songs.find(x=>x.number===id);const target=document.querySelector('#song-page');if(s){document.title=publicTitle(s)+' | PIZZA';const art=imageFor(s,'detail-art');if(art)target.append(art);const body=document.createElement('div');body.className='detail-body';const n=document.createElement('p');n.className='eyebrow';n.textContent=`ELEMENT ${s.number} / ${publicCode(s)}`;const h=document.createElement('h2');h.textContent=publicTitle(s);const album=document.createElement('p');album.textContent='収録：'+(cassetteOnlyNumbers.has(s.number)?'33 (1st Tape) / カセット限定':getAlbum(s));const desc=document.createElement('p');desc.textContent=isTeaser(s)?'情報公開をお待ちください。':(descriptions[s.number]||'楽曲紹介文は準備中です。');body.append(n,h,album,desc);if(!isTeaser(s)){const links=streamingLinks(albumByTitle(s.album));if(links.childElementCount)body.append(links)}const video=isTeaser(s)?null:videoFor(s);if(video)body.append(video);target.append(body)}else{target.textContent='楽曲が見つかりませんでした。'}</script><script src="data/social.js"></script></body></html>
